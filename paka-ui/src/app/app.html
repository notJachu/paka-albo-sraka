<main class="main">
  <mat-sidenav-container class="sidebar-container" [hasBackdrop]="true">
    <mat-sidenav #drawer mode="over" class="sidebar">
      <h3>Sidebar</h3>
      <nav class="sidebar-links">
        <a routerLink="/">Home</a>
        <a routerLink="/categories">Categories</a>
      </nav>
    </mat-sidenav>

<!--    TODO: Replace header with actual logo-->
    <div class="top-bar">
      <div class="menu-section">
        <button mat-icon-button (click)="drawer.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
        <h2><mat-icon>sports_bar</mat-icon>Paka</h2>
      </div>

      <form class="search-container" (ngSubmit)="onSearch()" #searchForm="ngForm">

        <button mat-icon-button type="submit" aria-label="Szukaj">
          <mat-icon>search</mat-icon>
        </button>

        <input
          type="text"
          name="query"
          [(ngModel)]="searchQuery"
          placeholder="Szukaj eventów"
          autocomplete="off"
          class="search-input">

        <button mat-icon-button type="button" aria-label="Pokaż opcje wyszukiwania" (click)="openFilters()">
          <mat-icon>tune</mat-icon>
        </button>

      </form>
    </div>
    <router-outlet />
    <footer>
        <p>Footer content goes here</p>
    </footer>
  </mat-sidenav-container>
</main>
